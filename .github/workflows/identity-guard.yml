name: identity-guard
# Fails when a tracked file or a commit carries an entry from the private IDENTITY_DENYLIST secret.
# See docs/dev/identity-guard.md. Here the guard runs with --counts-only: these logs are public, so
# a red run says how many hits there are, never where or which entry. Run it locally for the detail.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: identity-guard-${{ github.ref }}
  # Only a PR run may be cancelled: its next run checks the whole base..head range again. A
  # cancelled push run's before..after range is never checked by the next push, which starts
  # from this push's after.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python3: the guard is stdlib only. An unset secret fails the step.
      - name: Scan every tracked file
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: python3 scripts/identity_guard.py --counts-only
  commits:
    # Only on the public repository, where every commit's author, committer and message is public,
    # and so is every line a commit added, even one a later commit took out again.
    if: github.repository_owner == 'sysdad'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit authors, committers, messages and added lines
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            revs="${PR_BASE}..${PR_HEAD}"
          else
            case "${PUSH_BEFORE}" in
              *[!0]*)
                if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                  revs="${PUSH_BEFORE}..${PUSH_AFTER}"
                else
                  # A force push whose old tip is gone: check everything reachable instead.
                  revs="${PUSH_AFTER}"
                fi
                ;;
              *)
                # The first push to the branch: every commit reachable from it.
                revs="${PUSH_AFTER}"
                ;;
            esac
          fi
          echo "checking commits in ${revs}"
          python3 scripts/identity_guard.py --counts-only --commits "${revs}"
