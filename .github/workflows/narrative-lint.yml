name: narrative-lint
# Fails when a tracked text file carries a voice or provenance phrase from
# scripts/narrative_lint_phrases.txt (first person in docs and comments, or wording about one
# install or one person rather than the project). The phrases are public, so hits are printed.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: narrative-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python3: the lint is stdlib only.
      - name: Check voice and provenance phrases
        run: python3 scripts/narrative_lint.py
