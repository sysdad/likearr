# likearr - example Compose file. See docs/install.md.
#
# Copy to compose.yaml and fill in env.example as .env beside it (then `chmod 600 .env`).
# `docker compose up -d` starts the service; schedules are set on its Settings page.
# To build the image yourself, comment out each `image:` line and uncomment the `build:` block
# below it, in a clone of the repository.

services:
  likearr:
    image: ghcr.io/sysdad/likearr:0.5.3
    # build:
    #   context: .
    #   # To run as your data folder's owner instead of 1000:1000:
    #   args:
    #     LIKEARR_UID: "1026"
    #     LIKEARR_GID: "100"
    container_name: likearr
    env_file:
      - .env
    volumes:
      - ./likearr-data:/data  # must be writable by uid 1000 (or LIKEARR_UID)
    # Use "127.0.0.1:8770:8770" if a reverse proxy on this host is the only way in.
    ports:
      - "8770:8770"
    restart: unless-stopped
    mem_limit: 768m
    # Lets a running apply finish when the container stops.
    stop_grace_period: 30m

  # For commands you run by hand: `docker compose run --rm likearr-cli <command> -c /data/config.toml`.
  likearr-cli:
    image: ghcr.io/sysdad/likearr:0.5.3
    # build:
    #   context: .
    #   # Keep in step with the likearr service above.
    #   args:
    #     LIKEARR_UID: "1026"
    #     LIKEARR_GID: "100"
    container_name: likearr-cli
    env_file:
      - .env
    volumes:
      - ./likearr-data:/data
      # Clean up only: the library's parent, so Lidarr's root folder has the same path here as in
      # Lidarr. See docs/install.md, "Clean up setup".
      # - /path/to/media:/data/media
    command: ["--help"]
    profiles: ["tools"]
    restart: "no"
    healthcheck:
      disable: true

  # A second instance for another Spotify account: its own data folder, port and env file (with its
  # own LIKEARR_UI_PASSWORD). See docs/install.md, "More than one instance or Spotify account".
  # likearr-2:
  #   image: ghcr.io/sysdad/likearr:0.5.3
  #   container_name: likearr-2
  #   env_file:
  #     - .env.likearr-2
  #   volumes:
  #     - ./likearr-2-data:/data
  #   ports:
  #     - "8771:8770"
  #   restart: unless-stopped
  #   mem_limit: 768m
  #   stop_grace_period: 30m

# Upgrading: change every `image:` tag to the new version, then
# `docker compose pull && docker compose up -d`. To roll back, set the tags back.
