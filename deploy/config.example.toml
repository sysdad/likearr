# likearr configuration - the reference for every key.
#
# likearr writes this file to /data/config.toml on first start, and Settings edits it. Nothing here
# needs editing before a first start. Relative paths are relative to this file's folder.
#
# Secrets and addresses come from environment variables (see env.example), not this file. The one
# exception: a [health.webhook] url with a token in it is a secret, so keep this file private
# (`chmod o-rwx config.toml`).
#
# A misspelt key or an out-of-range value fails the load with a message naming it. Mistakes in
# [ui] and [prune] don't stop a run; they are reported where they are used.

[lidarr]
# An existing Lidarr root folder, exactly as Lidarr spells it (Settings -> Media Management).
# Picked in Settings; or uncomment and set it here.
# root_folder = "/data/media/music"
# An existing Lidarr quality profile for the artists likearr adds. Picked in Settings.
# quality_profile = "Standard"
# Names of the two metadata profiles likearr creates and uses.
lean_profile = "Lean"
full_profile = "Full"
# Tag likearr puts on every artist it adds.
tag = "likearr"
# Seconds to wait for Lidarr to refresh an artist: the base, plus this much per release, up to the
# maximum. An artist that runs out of time is retried next run.
refresh_timeout_s = 300
refresh_per_album_s = 2
refresh_timeout_max_s = 3600
# Most followed artists one run asks Lidarr to refresh for a new release it doesn't have yet.
# 0 turns this off.
max_refreshes_per_run = 10
# Hours before the same artist is refreshed again for the same missing release.
recent_gap_refresh_hours = 24

[spotify]
# The Spotify sign-in. Keep it private (mode 600).
token_file = "spotify-token.json"
# Which sources to read.
followed_artists = true
saved_albums = true
liked_tracks = true
# IDs of playlists you own or collaborate on, read like Liked Songs. Pick them in Settings.
playlists = []
# Must match a redirect URI registered in your Spotify app. Use 127.0.0.1, never localhost.
redirect_uri = "http://127.0.0.1:8765/callback"

[musicbrainz]
base_url = "https://musicbrainz.org/ws/2"
# Seconds between requests. musicbrainz.org needs at least 1.0; a mirror may go lower.
min_interval_s = 1.0
# Days to remember a lookup that found nothing.
negative_cache_days = 7
# Days to trust a lookup that found something.
positive_cache_days = 90

[state]
# likearr's record of what it monitored. Back it up.
db = "state.sqlite"
# Stops two runs overlapping. Default: <db>.lock.
lock_file = "likearr.lock"

[ui]
# Where a browser reaches Lidarr, for links on Status. Default: LIKEARR_LIDARR_URL.
# lidarr_url = "https://lidarr.example.org"
# The command Clean up puts in front of the commands it shows you. It must run the likearr-cli
# service with the library mounted.
# cli_command = "docker compose run --rm likearr-cli"
# likearr's own https:// address. When set, Connect Spotify needs no copy and paste; register
# <public_url>/spotify/callback in your Spotify app.
# public_url = "https://likearr.example.org"

# ------------------------------------------------------------------------------------------------
# The defaults below suit most installs. After changing a rule, check for changes and apply by
# hand: the change can unmonitor more than a scheduled run will.
# ------------------------------------------------------------------------------------------------

[rules]
# Days a liked single waits for its album before likearr monitors the single instead.
singles_fallback_days = 180
# Lidarr tag for a followed artist whose studio albums you want, but not their EPs.
albums_only_tag = "albums-only"
# What a liked or playlist song monitors:
#   "album"    - the studio album or EP it's on (the default).
#   "smallest" - the smallest studio release holding it: single, then EP, then album. For an
#                artist you follow, the album.
liked_track_scope = "album"
# Days a followed artist's release counts as new, so likearr asks Lidarr to refresh the artist
# when Lidarr doesn't have it yet.
recent_release_days = 60
# Opt-outs.
# false: don't monitor a compilation or box set that is a song's only release; report it instead.
allow_compilation_fallback = true
# false: don't pick a remix release for a song that isn't itself a remix.
allow_remix_releases = true
# With remix releases off - true: a song found only on remix releases is still monitored on one.
keep_remix_only_tracks = true
# Release group MBIDs never to monitor for a song or followed artist. A saved album still wins.
deny_releases = []

[guards]
# A scheduled run that would unmonitor more than this many releases unmonitors none of them and
# reports why.
max_unmonitors_scheduled = 100
# Percent a source may shrink since the last run before its unmonitors are held back. Accept a real
# shrink with "Let this check unmonitor what a shrink guard held back", or `run --accept-shrink`.
source_shrink_pct = 10.0
# The same, per followed artist's studio releases.
artist_shrink_pct = 30.0
# Report "degraded" when more than this fraction of songs newly fail to match.
unmapped_ratio_amber = 0.05
# Warn when more than this many monitored releases would have no files.
projected_wanted_max = 1000

[health]
# Print a JSON health record after every run.
stdout = true

# MQTT. Login comes from LIKEARR_MQTT_USERNAME / LIKEARR_MQTT_PASSWORD. See docs/install.md.
# [health.mqtt]
# host = "mqtt.example.internal"
# port = 1883
# topic = "likearr/health"
# retain = true

# Webhook: POSTs the health record as JSON, with title, body and type. See docs/install.md.
# A url with a token in it is a secret. notify: "always" (default) or "problems".
# [health.webhook]
# url = "https://example.internal/hooks/likearr"
# timeout_s = 10
# notify = "problems"

[schedule]
# Set these in Settings. When scheduled runs fire: minute hour day month weekday, in `timezone`.
# At most once an hour.
# cron = "20 */6 * * *"
# Default UTC. Set your own zone.
# timezone = "America/New_York"
# false pauses scheduled runs. Plans you review and apply yourself still run.
# enabled = true
# Shown on Status while paused. Written by Settings.
# paused_reason = ""
# paused_at = 2026-01-05T18:00:00Z

[prune]
# Turns on Clean up in the web UI (Settings > Advanced).
# enabled = false
# Where Clean up moves albums: beside the root folder, on the same filesystem, never inside it.
# Default: _likearr-holding in the root folder's parent.
# holding_dir = "/data/media/_likearr-holding"
