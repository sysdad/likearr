{# "Check again": start a new dry run. The shrink choice is optional and tucked away; it opens by
   itself when it carries over ticked from the plan before. Needs `replan_shrink`. #}
<form method="post" action="/plan" class="replan">
  <div class="actions"><button type="submit" class="primary">Check again</button></div>
  <details{% if replan_shrink %} open{% endif %}>
    <summary>Advanced (optional)</summary>
    <label class="check"><input type="checkbox" name="accept_shrink"{% if replan_shrink %} checked{% endif %}> Let this check unmonitor what a shrink guard held back{% if replan_shrink %}, as the last check did{% endif %}. <span class="optional">Only for a shrink you know is real - a playlist you emptied on purpose. You don't need this to check.</span></label>
  </details>
</form>
