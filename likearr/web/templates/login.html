{% extends "base.html" %}
{% block title %}Log in - likearr{% endblock %}
{% block nav %}<nav><span class="brand"><img src="/static/icon.svg" alt="" class="brand-mark" aria-hidden="true">likearr</span></nav>{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="login">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <p class="help">The LIKEARR_UI_PASSWORD you set when you installed likearr.</p>
  <button type="submit" class="primary">Log in</button>
</form>
{% endblock %}
