[project]
name = "likearr"
version = "0.5.1"
description = "Mirror your Spotify follows, saved albums and Liked Songs into Lidarr - and nothing else."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "sysdad" }]
keywords = ["lidarr", "spotify", "musicbrainz", "arr", "music"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "httpx>=0.27",
  "paho-mqtt>=2.0",
  # `likearr start`: the service (web UI, scheduler, job runner) - the whole product since the
  # single-service cutover, so every install needs it. htmx is vendored under
  # likearr/web/static, not a dependency.
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.32",
  "starlette>=1.6.0",
  "tomlkit>=0.15.1",
  "tzdata>=2026.4",
  "uvicorn>=0.53.0",
]

[project.scripts]
likearr = "likearr.shell.cli:main"

[project.urls]
Homepage = "https://github.com/sysdad/likearr"
Issues = "https://github.com/sysdad/likearr/issues"
Changelog = "https://github.com/sysdad/likearr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest-timeout>=2.4.0",
  # `starlette.testclient` prefers `httpx2` over `httpx` and warns (deprecated) when it falls back;
  # installing it silences that warning at the source, per the migration the warning itself names.
  "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["likearr"]

# `likearr start` writes a first config.toml from the example (`config.write_initial_config`),
# so an installed package carries its own copy. A source checkout reads deploy/ directly.
[tool.hatch.build.targets.wheel.force-include]
"deploy/config.example.toml" = "likearr/config.example.toml"

[tool.ruff]
line-length = 120
target-version = "py312"
# scripts/ holds repo tooling (demo data, screenshots, replays, the identity guard and narrative
# lint); it is not part of the package and is not held to its lint/type bar.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"likearr/shell/cli.py" = ["T20"]
"tests/*" = ["T20"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["likearr", "tests"]
reportMissingImports = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# No test may hang CI or a session: a stuck subprocess, lock poll or server fails its test instead.
timeout = 60
markers = ["integration: needs a live Lidarr (LIKEARR_TEST_LIDARR_URL)"]
filterwarnings = [
  # `httpx2` (dev extra) is installed, so `starlette.testclient` never raises this itself today -
  # this is insurance against the next thing Starlette deprecates there scrolling past unnoticed.
  # It is `StarletteDeprecationWarning`, a `UserWarning` subclass, not a `DeprecationWarning`.
  "error::starlette.exceptions.StarletteDeprecationWarning",
]
